name: Validate Charts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: read-all

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run checkov
        uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e  # v12
        id: checkov
        with:
          output_format: cli,sarif
          output_file_path: console,results.sarif
          var_file: test/dummy-vars.yaml
        env:
          HELM_NAMESPACE: dummy-ns
        continue-on-error: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4
        with:
          sarif_file: results.sarif

      - name: Report failure
        if: steps.checkov.outcome == 'failure'
        run: |
          echo "The checkov scan resulted in failure. See the output of the above step."
          exit 1
