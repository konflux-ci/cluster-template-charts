name: Validate Charts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: read-all

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Run checkov
        uses: bridgecrewio/checkov-action@9b70310bcd306d11740313070b940167d6b23085  # v12
        id: checkov
        with:
          output_format: cli,sarif
          output_file_path: console,results.sarif
          var_file: test/dummy-vars.yaml
        env:
          HELM_NAMESPACE: dummy-ns
        continue-on-error: true

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4
        with:
          sarif_file: results.sarif

      - name: Report failure
        if: steps.checkov.outcome == 'failure'
        run: |
          echo "The checkov scan resulted in failure. See the output of the above step."
          exit 1
